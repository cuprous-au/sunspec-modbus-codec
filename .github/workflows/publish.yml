on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build C Binary
        run: cross build --release --target ${{ matrix.target }} --package sunspecmodbus

      - name: Rename C Binary
        run: |
          mkdir artifact
          cp target/${{ matrix.target }}/release/libsunspecmodbus.a \
            artifact/libsunspecmodbus-${{ github.ref_name }}-${{ matrix.target }}.a
          cp crates/sunspec-modbus-lib-static/libsunspecmodbus.h artifact

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifact

  publish:
    runs-on: ubuntu-latest
    
    # CRITICAL: Required for secure OIDC token exchange
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          sed -i "s/1.0.0-SNAPSHOT/${VERSION}/g" Cargo.toml
          cargo publish --allow-dirty -p sunspec-modbus-derive
          cargo publish --allow-dirty -p sunspec-modbus-lib-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/*.a
            release-assets/x86_64-unknown-linux-musl/libsunspecmodbus.h
