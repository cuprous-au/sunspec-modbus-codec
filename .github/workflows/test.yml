name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Ensure generated code is up to date and aligned with the current implementation of sunspec-gen
        run: |
          cargo run -p sunspec-gen
          git diff --exit-code
      - name: Format, lint and test
        run: |
          cargo build
          cargo fmt -- --check
          cargo clippy --tests --features sunspec-modbus-lib-rs/test-models --verbose -- -D warnings
          cargo test --workspace --exclude system-tests --features sunspec-modbus-lib-rs/test-models --verbose
