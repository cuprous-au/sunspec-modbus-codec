language = "C"
pragma_once = true
include_guard = "SUNSPEC_MODBUS_CODEC_H"
cpp_compat = true
include_version = true
documentation = true
documentation_style = "c"

style = "both"
sort_by = "Name"
usize_is_size_t = true

[parse]
parse_deps = true
clean = true
include = ["sunspec-modbus-lib-rs"]
# Lets cbindgen export the per-model `SUNSPEC_MODEL_<id>` statics (and the typed adapter
# constructors' `SUNSPEC_MODEL_<id>` references) straight from where they're defined, instead
# of needing them hand-spliced into the header.
extra_bindings = ["sunspec-modbus-lib-rs"]

[export]
item_types = ["constants", "functions", "typedefs", "structs", "enums", "globals", "opaque"]
include = []

[enum]
prefix_with_name = true
