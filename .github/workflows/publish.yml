on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build C Binary
        run: cross build --release --target ${{ matrix.target }} --package sunspecmodbus

      - name: Rename C Binary
        run: |
          mkdir artifact
          cp target/${{ matrix.target }}/release/libsunspecmodbus.a \
            artifact/libsunspecmodbus-${{ github.ref_name }}-${{ matrix.target }}.a
          cp crates/sunspec-modbus-lib-static/libsunspecmodbus.h artifact

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifact

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/*.a
            release-assets/x86_64-unknown-linux-musl/libsunspecmodbus.h
