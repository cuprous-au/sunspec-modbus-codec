language = "C"
pragma_once = true
include_guard = "SUNSPEC_MODBUS_CODEC_H"
cpp_compat = true
include_version = true
documentation = true
documentation_style = "c"

style = "both"
sort_by = "Name"
usize_is_size_t = true

[parse]
parse_deps = true
clean = true
include = ["sunspec-modbus-lib-rs"]

[export]
item_types = ["constants", "functions", "typedefs", "structs", "enums"]
# `SunspecModelBinding` points at per-model `Model<id>{Stateful,Callback}Adapter` structs as
# `void*`, so nothing in this crate's signatures references them. Force the codec crate's
# adapter bag in: it names every one of those structs, and cbindgen follows the transitive
# types, so the header keeps the definitions C callers build.
#
# `CModel` is the per-model dispatch descriptor. C only ever holds `const CModel *` (taken
# from the `SUNSPEC_MODEL_<id>` externs that `build.rs` splices in), never its fields, so it
# stays an opaque incomplete type here.
include = ["SunspecExternalAdapters"]

[enum]
prefix_with_name = true
